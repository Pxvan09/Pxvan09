# ════════════════════════════════════════════════════════════
#  GitHub Actions — Contribution Snake Generator
#  Place at: .github/workflows/snake.yml
#  Generates animated snake SVGs from your contribution graph.
#  After setup: Actions → "Generate Contribution Snake" → Run workflow
# ════════════════════════════════════════════════════════════

name: 🐍 Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"    # Runs daily at midnight UTC
  workflow_dispatch:         # Allows manual trigger from Actions tab
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate snake SVGs (light + dark themes)
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Deploy SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
